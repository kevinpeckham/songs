# Checks every chart in songs/ with the barmark command. MIT-licensed.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Every chart reads cleanly
        run: npx -y @barmark/cli@0.1.5 check --strict --format github songs
      - name: Every chart is in standard form
        run: npx -y @barmark/cli@0.1.5 format --check songs
